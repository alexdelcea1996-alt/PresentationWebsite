<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The mark: eight rays meeting at the centre, on the iris-to-jade tile.

    The rays used to be detached dashes around an empty middle. That reads
    beautifully at 512px and turns to grey mush at 16 — where a favicon actually
    lives — and worse, the ring of separated ticks reads as a loading spinner,
    which is a poor joke on a site that sells speed. Joining them at the centre
    fixes both: the silhouette survives 16px as one solid shape, and nothing
    about it suggests waiting.

    Same eight directions as before, so this is the mark growing up rather than
    a different mark. Cardinal rays reach further than the diagonals, which is
    what keeps it a star instead of a snowflake.

    Geometry is shared with `src/data/icons.ts` (the header and footer logo) and
    with the spark custom property in `src/styles/global.css` (the section
    labels), scaled to a 24 viewBox. All three must move together.

    Keep double hyphens out of this comment: XML forbids them inside one, and
    sharp refuses the whole file rather than the comment.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8370fe"/>
      <stop offset="1" stop-color="#56deb2"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#g)"/>
  <g stroke="#05070d" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M16 5.5v21M5.5 16h21"/>
    <path d="m10.34 10.34 11.32 11.32M21.66 10.34 10.34 21.66"/>
  </g>
</svg>
