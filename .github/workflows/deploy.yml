name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      # Lets the site go live from the development branch before the first merge.
      - claude/portfolio-website-planning-v7mz1y
  workflow_dispatch:

# Required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, and let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Change both when moving to a custom domain: SITE_URL to the domain, BASE_PATH to "/".
  SITE_URL: https://alexdelcea1996-alt.github.io
  BASE_PATH: /PresentationWebsite

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Turns Pages on for the repository if it is not already enabled,
      # so no manual step in Settings is needed.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx astro check

      - name: Build
        run: npm run build
        env:
          # Optional: add the key under Settings → Secrets → Actions to switch the
          # contact form from the mailto fallback to Web3Forms delivery.
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_KEY }}

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
